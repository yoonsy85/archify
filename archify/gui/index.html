<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Archify</title>
<style>
:root{--bg:#0f1318;--fg:#e6edf3;--mut:#8b98a5;--card:#171d25;--bd:#2a3340;--ac:#0891b2}
@media(prefers-color-scheme:light){:root{--bg:#f6f8fa;--fg:#1f2328;--mut:#59636e;--card:#fff;--bd:#d0d7de}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
header{padding:10px 16px;border-bottom:1px solid var(--bd);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h1{font-size:16px;margin:0 12px 0 0}select,button,a.btn{font:inherit;padding:7px 12px;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer;text-decoration:none}
button.primary{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
main{flex:1;display:grid;grid-template-columns:minmax(280px,38%) 1fr;min-height:0}
@media(max-width:800px){main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
.left{display:flex;flex-direction:column;border-right:1px solid var(--bd);min-height:0}
textarea{flex:1;border:0;resize:none;padding:12px;background:var(--card);color:var(--fg);font:12px ui-monospace,monospace;outline:0}
#log{max-height:30%;overflow:auto;margin:0;padding:8px 12px;font:12px ui-monospace,monospace;color:var(--mut);white-space:pre-wrap;border-top:1px solid var(--bd)}
#log.err{color:#f85149}iframe{width:100%;height:100%;border:0;background:#fff}
.right{display:flex;flex-direction:column;min-height:0}.empty{margin:auto;color:var(--mut)}
</style></head><body>
<header><h1>Archify</h1>
<select id="type"></select><select id="ex"></select>
<button class="primary" id="render">▶ Render</button>
<a class="btn" id="open" target="_blank" hidden>Open in new tab</a>
<a class="btn" id="dl" hidden>Download HTML</a>
<button id="doctor">Run Doctor</button></header>
<main><div class="left"><textarea id="json" spellcheck="false" placeholder="Paste diagram JSON here, or pick an example above"></textarea><pre id="log"></pre></div>
<div class="right"><div class="empty" id="empty">Pick an example and press ▶ Render</div><iframe id="view" hidden></iframe></div></main>
<script>
const $=id=>document.getElementById(id);let all=[];
const api=(p,b)=>fetch(p,b&&{method:'POST',body:JSON.stringify(b)}).then(r=>r.json());
const log=(t,e)=>{$('log').textContent=t;$('log').className=e?'err':''};
function fillEx(){const t=$('type').value;$('ex').innerHTML=all.filter(e=>e.type===t).map(e=>`<option value="${e.file}">${e.name}</option>`).join('');loadEx()}
async function loadEx(){if(!$('ex').value)return;$('json').value=await (await fetch('/api/example?file='+encodeURIComponent($('ex').value))).text()}
async function render(){log('Rendering…');$('render').disabled=true;
 try{const r=await api('/api/render',{type:$('type').value,json:$('json').value});
  log(r.output||(r.ok?'Done.':'Failed.'),!r.ok);
  if(r.ok&&r.id){const u=`/out/${r.id}.html`;$('view').src=u;$('view').hidden=false;$('empty').hidden=true;
   $('open').href=u;$('dl').href=u+'?download';$('open').hidden=$('dl').hidden=false}}
 catch(e){log(String(e),1)}finally{$('render').disabled=false}}
$('type').onchange=fillEx;$('ex').onchange=loadEx;$('render').onclick=render;
$('doctor').onclick=async()=>{log('Running doctor…');const r=await api('/api/doctor',{});log(r.output,!r.ok)};
api('/api/examples').then(d=>{all=d.examples;$('type').innerHTML=d.types.map(t=>`<option>${t}</option>`).join('');fillEx()});
</script></body></html>
